# ============================================================
# apache-vhosts.conf - quinigana.com + neotime.es
# Reemplaza C:\EasyPHP-Devserve\eds-dashboard\apache-vhosts.conf
# HAZ BACKUP ANTES (ver 00-INSTRUCCIONES.md)
# ============================================================

# ---------- QUINIGANA :80 (redirige a HTTPS + ACME) ----------
<VirtualHost *:80>
    ServerName quinigana.com
    ServerAlias www.quinigana.com
    DocumentRoot "C:/EasyPHP-Devserve/eds-www/quinigana"

    # Let's Encrypt debe poder validar por HTTP sin redirigir
    Alias /.well-known/acme-challenge "C:/EasyPHP-Devserve/eds-www/quinigana/.well-known/acme-challenge"
    <Directory "C:/EasyPHP-Devserve/eds-www/quinigana/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog "${LOG_DIR}/error_vh_quinigana.com.log"
    CustomLog "${LOG_DIR}/access_vh_quinigana.com.log" combined
</VirtualHost>

# ---------- QUINIGANA :8080 ----------
<VirtualHost *:${SRVPORT}>
    DocumentRoot "C:/EasyPHP-Devserve/eds-www/quinigana"
    ServerName quinigana.com
    ServerAlias www.quinigana.com
    ErrorLog "${LOG_DIR}/error_vh_quinigana.com.log"
    CustomLog "${LOG_DIR}/access_vh_quinigana.com.log" combined
    <Directory "C:/EasyPHP-Devserve/eds-www/quinigana">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ---------- QUINIGANA :443 (SSL + proxy backend Node) ----------
<VirtualHost *:443>
    DocumentRoot "C:/EasyPHP-Devserve/eds-www/quinigana"
    ServerName quinigana.com
    ServerAlias www.quinigana.com
    ErrorLog "${LOG_DIR}/error_vh_quinigana.com.log"
    CustomLog "${LOG_DIR}/access_vh_quinigana.com.log" combined

    SSLEngine on
    SSLCertificateFile "${APPROOT}/eds-dashboard/certificates/quinigana.com_certfile.pem"
    SSLCertificateKeyFile "${APPROOT}/eds-dashboard/certificates/quinigana.com_certkeyfile.pem"

    # --- Proxy al backend Node (puerto 3000) ---
    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket (Socket.IO) - DEBE ir antes que ProxyPass /api
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket\.io/(.*) ws://127.0.0.1:3000/socket.io/$1 [P,L]

    ProxyPass        /socket.io http://127.0.0.1:3000/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:3000/socket.io
    ProxyPass        /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    # Avatares y adjuntos: los ficheros los escribe el backend en su propia
    # carpeta, pero la BD guarda rutas /uploads/... que Apache resuelve contra
    # el DocumentRoot del frontend, donde no existen. Sin este alias la regla
    # SPA los captura y devuelve index.html en lugar de la imagen.
    Alias /uploads "C:/wamp64/www/node/quinigana-backend/uploads"
    <Directory "C:/wamp64/www/node/quinigana-backend/uploads">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # SPA Angular: rutas no-fichero -> index.html
    # Va al nivel del vhost, no dentro de <Directory>: ahi %{REQUEST_FILENAME}
    # es relativo al directorio y la comprobacion -f falla en subcarpetas,
    # devolviendo 404 en /icons/*.png y demas estaticos anidados.
    RewriteCond %{REQUEST_URI} !^/api
    RewriteCond %{REQUEST_URI} !^/socket\.io
    RewriteCond %{REQUEST_URI} !^/uploads
    RewriteCond %{REQUEST_URI} !^/\.well-known
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule ^ /index.html [L]

    <Directory "C:/EasyPHP-Devserve/eds-www/quinigana">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ---------- NEOTIME :8080 (rutas corregidas) ----------
<VirtualHost *:${SRVPORT}>
    DocumentRoot "C:/EasyPHP-Devserve/eds-www/neotime"
    ServerName neotime.es
    ServerAlias www.neotime.es
    ErrorLog "${LOG_DIR}/error_vh_neotime.es.log"
    CustomLog "${LOG_DIR}/access_vh_neotime.es.log" combined

    <Directory "C:/EasyPHP-Devserve/eds-www/neotime">
        Options FollowSymLinks Indexes
        AllowOverride All
        Require all granted
    </Directory>
    <Directory "C:/EasyPHP-Devserve/eds-www/neotime/API_NEOTIME">
        Options FollowSymLinks Indexes
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ---------- NEOTIME :443 (sin cambios funcionales) ----------
<VirtualHost *:443>
    DocumentRoot "C:/EasyPHP-Devserve/eds-www/neotime"
    ServerName neotime.es
    ServerAlias www.neotime.es
    ErrorLog "${LOG_DIR}/error_vh_neotime.es.log"
    CustomLog "${LOG_DIR}/access_vh_neotime.es.log" combined

    SSLEngine on
    SSLCertificateFile "${APPROOT}/eds-dashboard/certificates/certificado.crt"
    SSLCertificateKeyFile "${APPROOT}/eds-dashboard/certificates/certificado.key"
    <Directory "C:/EasyPHP-Devserve/eds-www/neotime">
        Options FollowSymLinks Indexes
        AllowOverride All
        Require all granted
    </Directory>
    <Directory "C:/EasyPHP-Devserve/eds-www/neotime/API_NEOTIME">
        Options FollowSymLinks Indexes
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
