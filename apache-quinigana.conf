<VirtualHost *:80>
    ServerName quinigana.com
    ServerAlias www.quinigana.com

    # Ruta donde están los archivos del frontend compilado
    DocumentRoot "C:/wamp64/www/quinigana"

    # Proxy para el API backend (Node.js en puerto 3000)
    # IMPORTANTE: Esto debe ir ANTES del Directory para que tenga prioridad
    ProxyPreserveHost On
    ProxyRequests Off

    # API endpoints
    ProxyPass /api http://localhost:3000/api
    ProxyPassReverse /api http://localhost:3000/api

    # WebSocket para Socket.io
    ProxyPass /socket.io http://localhost:3000/socket.io
    ProxyPassReverse /socket.io http://localhost:3000/socket.io

    # WebSocket upgrade headers
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://localhost:3000/$1" [P,L]

    <Directory "C:/wamp64/www/quinigana">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Para que Angular routing funcione (SPA)
        RewriteEngine On

        # Si es una petición al API o socket.io, no hacer nada (ya se maneja arriba)
        RewriteCond %{REQUEST_URI} ^/api [OR]
        RewriteCond %{REQUEST_URI} ^/socket\.io
        RewriteRule ^ - [L]

        # Si el archivo o directorio existe, sírvelo directamente
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Para todas las demás rutas, servir index.html (Angular se encarga del routing)
        RewriteRule ^ /index.html [L]
    </Directory>

    # Logs
    ErrorLog "logs/quinigana-error.log"
    CustomLog "logs/quinigana-access.log" common
</VirtualHost>
