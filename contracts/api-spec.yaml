# New/Updated API Endpoints\nGET /api/v1/docs -> Swagger UI\nGET /api/v1/health -> { status, db, cache, uptime }\nGET /api/v1/health/ready -> readiness probe\n\n# Search & Filtering\nGET /api/v1/jornadas?search=&status=&season=&cursor=&limit= -> cursor-based pagination\nGET /api/v1/proposals?groupId=&jornadaId=&status=&cursor=&limit=\n\n# Data Export\nGET /api/v1/stats/export?format=csv|pdf&type=rankings|predictions&jornadaId=\n\n# Challenges (complete)\nPOST /api/v1/challenges -> create challenge\nGET /api/v1/challenges/:id -> get challenge detail\nPUT /api/v1/challenges/:id/accept -> accept challenge\nPUT /api/v1/challenges/:id/predictions -> submit predictions\nGET /api/v1/challenges/history -> user challenge history\n\n# Request tracing header\nX-Request-Id: uuid (auto-generated if missing)